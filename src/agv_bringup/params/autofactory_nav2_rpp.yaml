amcl:
  ros__parameters:
    use_sim_time: true
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: base_footprint
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: map
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 100.0
    laser_min_range: -1.0
    laser_model_type: likelihood_field
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: odom
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: nav2_amcl::DifferentialMotionModel
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.2
    update_min_d: 0.25
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: /scan


bt_navigator:
  ros__parameters:

    # =====================================================
    # AutoFactory Humble Behavior Trees
    #
    # Normal Nav2 / Coverage explicitly use
    # general_goal_checker.
    # Parking Staging keeps using
    # staging_goal_checker directly.
    # =====================================================

    default_nav_to_pose_bt_xml: /home/my-ubuntu/autofactory_ws/src/agv_bringup/behavior_trees/autofactory_navigate_to_pose.xml

    default_nav_through_poses_bt_xml: /home/my-ubuntu/autofactory_ws/src/agv_bringup/behavior_trees/autofactory_navigate_through_poses.xml
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000

    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node
      - nav2_is_battery_charging_condition_bt_node


bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: true


bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: true


controller_server:
  ros__parameters:
    use_sim_time: true

    controller_frequency: 20.0

    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001

    failure_tolerance: 0.8

    progress_checker_plugin: progress_checker

    # ==========================================================
    # Goal Checkers
    #
    # general_goal_checker:
    #   原有Coverage与普通Nav2任务继续使用。
    #
    # staging_goal_checker:
    #   Parking Staging专用。
    #   FollowPath只负责把机器人精确送到XY位置，
    #   最终yaw由后续Spin单独完成。
    # ==========================================================

    goal_checker_plugins:
      - general_goal_checker
      - staging_goal_checker

    controller_plugins:
      - FollowPath

    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.2
      movement_time_allowance: 20.0

    # ----------------------------------------------------------
    # 原有Goal Checker
    # Coverage / 普通Nav2保持原参数，不修改
    # ----------------------------------------------------------

    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 1.57

    # ----------------------------------------------------------
    # Parking Staging专用Goal Checker
    #
    # XY要求更严格：
    #   5 cm
    #
    # yaw在这一阶段故意放宽：
    #   FollowPath到XY点后，
    #   parking_staging_navigator再调用/spin
    #   将最终朝向调整到yaw=3.1 rad。
    # ----------------------------------------------------------

    staging_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.05
      yaw_goal_tolerance: 3.14

    # ----------------------------------------------------------
    # Regulated Pure Pursuit
    # ----------------------------------------------------------

    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController

      desired_linear_vel: 0.30

      lookahead_dist: 0.45
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.8
      lookahead_time: 1.5

      use_velocity_scaled_lookahead_dist: true

      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6

      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true

      regulated_linear_scaling_min_radius: 0.7
      regulated_linear_scaling_min_speed: 0.08

      cost_scaling_dist: 0.6
      cost_scaling_gain: 0.8

      inflation_cost_scaling_factor: 3.0

      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0

      allow_reversing: false

      use_rotate_to_heading: false
      rotate_to_heading_min_angle: 0.785
      rotate_to_heading_angular_vel: 0.35

      max_angular_accel: 0.7

      use_interpolation: true

      transform_tolerance: 0.2

      stateful: true


local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0

      global_frame: odom
      robot_base_frame: base_footprint

      use_sim_time: true

      rolling_window: true

      width: 3
      height: 3
      resolution: 0.05

      robot_radius: 0.22

      plugins:
        - voxel_layer
        - inflation_layer

      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 0.55

      voxel_layer:
        plugin: nav2_costmap_2d::VoxelLayer
        enabled: true
        publish_voxel_map: true

        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16

        max_obstacle_height: 2.0
        mark_threshold: 0

        observation_sources: scan

        scan:
          topic: /scan
          max_obstacle_height: 2.0

          clearing: true
          marking: true

          data_type: LaserScan

          raytrace_max_range: 3.0
          raytrace_min_range: 0.0

          obstacle_max_range: 2.5
          obstacle_min_range: 0.0

      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true

      always_send_full_costmap: true


global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0

      global_frame: map
      robot_base_frame: base_footprint

      use_sim_time: true

      robot_radius: 0.22
      resolution: 0.05

      track_unknown_space: true

      plugins:
        - static_layer
        - obstacle_layer
        - inflation_layer

      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true

        observation_sources: scan

        scan:
          topic: /scan

          max_obstacle_height: 2.0

          clearing: true
          marking: true

          data_type: LaserScan

          raytrace_max_range: 3.0
          raytrace_min_range: 0.0

          obstacle_max_range: 2.5
          obstacle_min_range: 0.0

      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true

      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 0.55

      always_send_full_costmap: true


map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ''


map_saver:
  ros__parameters:
    use_sim_time: true

    save_map_timeout: 5.0

    free_thresh_default: 0.25
    occupied_thresh_default: 0.65

    map_subscribe_transient_local: true


planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0

    use_sim_time: true

    # ==========================================================
    # 两个Planner并存
    #
    # GridBased:
    #   保留原来的Coverage / 普通导航行为。
    #
    # StagingGrid:
    #   Parking Staging专用。
    #   tolerance=0.0，不允许NavFn自动把目标替换为
    #   目标周围0.5m内的其他可达位置。
    # ==========================================================

    planner_plugins:
      - GridBased
      - StagingGrid

    # ----------------------------------------------------------
    # 原有Planner
    # ----------------------------------------------------------

    GridBased:
      plugin: nav2_navfn_planner/NavfnPlanner
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

    # ----------------------------------------------------------
    # Parking Staging专用Planner
    # ----------------------------------------------------------

    StagingGrid:
      plugin: nav2_navfn_planner/NavfnPlanner
      tolerance: 0.0
      use_astar: false
      allow_unknown: true


smoother_server:
  ros__parameters:
    use_sim_time: true

    smoother_plugins:
      - simple_smoother

    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true


behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint

    cycle_frequency: 10.0

    behavior_plugins:
      - spin
      - backup
      - drive_on_heading
      - assisted_teleop
      - wait

    spin:
      plugin: nav2_behaviors/Spin

    backup:
      plugin: nav2_behaviors/BackUp

    drive_on_heading:
      plugin: nav2_behaviors/DriveOnHeading

    wait:
      plugin: nav2_behaviors/Wait

    assisted_teleop:
      plugin: nav2_behaviors/AssistedTeleop

    global_frame: odom
    robot_base_frame: base_footprint

    transform_tolerance: 0.1

    use_sim_time: true

    simulate_ahead_time: 1.0

    max_rotational_vel: 0.35
    min_rotational_vel: 0.05
    rotational_acc_lim: 0.5


robot_state_publisher:
  ros__parameters:
    use_sim_time: true


waypoint_follower:
  ros__parameters:
    use_sim_time: true

    loop_rate: 20

    stop_on_failure: false

    waypoint_task_executor_plugin: wait_at_waypoint

    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 200


velocity_smoother:
  ros__parameters:
    use_sim_time: true

    smoothing_frequency: 25.0

    scale_velocities: false

    feedback: OPEN_LOOP

    max_velocity:
      - 0.45
      - 0.0
      - 0.5

    min_velocity:
      - 0.00
      - 0.0
      - -0.55

    max_accel:
      - 0.45
      - 0.0
      - 0.4

    max_decel:
      - -0.45
      - 0.0
      - -0.5

    odom_topic: /odom

    odom_duration: 0.1

    deadband_velocity:
      - 0.0
      - 0.0
      - 0.0

    velocity_timeout: 0.5
