# ============================================================
# AutoFactory Hybrid A* Parking Configuration
# ============================================================


# ============================================================
# Hybrid A* Parking Planner
# ============================================================

parking_planner:
  ros__parameters:

    use_sim_time: true


    # ========================================================
    # Frames
    # ========================================================

    map_frame: map
    base_frame: base_footprint


    # ========================================================
    # Collision Map
    #
    # 使用Nav2 Global Costmap。
    # 已经验证：
    # Hybrid A*路径能够绕开二维码蓝色Inflation区域。
    # ========================================================

    map_topic: /global_costmap/costmap


    # ========================================================
    # ArUco prerequisite
    # ========================================================

    require_aruco_lock: true
    aruco_locked_topic: /aruco/locked


    # ========================================================
    # Parking Goal
    #
    # ROS map frame
    # ========================================================

    goal_x: -8.357680
    goal_y: -4.166548
    goal_yaw: 1.539811


    # ========================================================
    # Global Costmap Collision
    #
    # cost = 0:
    #     free
    #
    # cost >= 1:
    #     obstacle
    #
    # 因此二维码周围整个蓝色Inflation区域都禁止进入。
    # ========================================================

    occupied_threshold: 1

    unknown_is_obstacle: true


    # Global Costmap本身已经进行了安全膨胀，
    # 不重复添加0.22m机器人半径。
    robot_radius: 0.0


    # 在蓝色Inflation区域之外再增加5cm。
    safety_margin: 0.05


    # ========================================================
    # Hybrid A*
    # ========================================================

    xy_step: 0.10

    yaw_resolution_deg: 5.0

    min_turning_radius: 0.40

    collision_check_step: 0.025

    allow_reverse: true

    allow_in_place_rotation: true

    spin_step_deg: 10.0


    # ========================================================
    # Cost
    # ========================================================

    reverse_penalty: 1.30

    gear_switch_penalty: 0.40

    turning_penalty: 0.15

    spin_penalty: 1.20


    # ========================================================
    # Heuristic
    # ========================================================

    yaw_heuristic_weight: 1.0

    heuristic_weight: 1.0


    # ========================================================
    # Goal tolerance
    # ========================================================

    goal_xy_tolerance: 0.12

    goal_yaw_tolerance_deg: 8.0


    # ========================================================
    # Search
    # ========================================================

    search_margin: 3.0

    max_expansions: 120000



# ============================================================
# Parking Path Tracker V3.1
# ============================================================

parking_path_tracker:
  ros__parameters:

    use_sim_time: true


    # ========================================================
    # Version
    # ========================================================

    tracker_version: "V3.2_SAFE_GEOMETRY"


    # ========================================================
    # Frames
    # ========================================================

    map_frame: map
    base_frame: base_footprint


    # ========================================================
    # Path
    # ========================================================

    path_topic: /parking/hybrid_path


    # ========================================================
    # Velocity
    # ========================================================

    cmd_vel_topic: /cmd_vel

    control_frequency: 20.0


    # ========================================================
    # Path preprocessing / tracking
    # ========================================================

    duplicate_xy_tolerance: 0.025

    lookahead_distance: 0.0

    waypoint_tolerance: 0.07

    pass_lateral_tolerance: 0.10


    # ========================================================
    # Final parking
    # ========================================================

    final_xy_tolerance: 0.07

    final_yaw_tolerance_deg: 3.0


    # ========================================================
    # Speed
    # ========================================================

    max_linear_speed: 0.08

    min_linear_speed: 0.025

    max_angular_speed: 0.40

    min_angular_speed: 0.07


    # ========================================================
    # Control gains
    # ========================================================

    linear_gain: 0.65

    heading_gain: 2.00

    final_spin_gain: 1.30


    # ========================================================
    # Alignment
    # ========================================================

    rotate_before_drive_deg: 30.0


    # ========================================================
    # Timeout
    # ========================================================

    execution_timeout_sec: 600.0

    alignment_timeout_sec: 25.0
